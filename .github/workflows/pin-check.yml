name: AppStream pin

# The Arch AppStream catalogue is pinned in appstream_pins.sh by a pkgver and a
# sha256 per artifact. That pin is committed source and is the trust anchor for
# the network download path — when upstream publishes a new release, the pin has
# to be bumped by hand.
#
# Until someone does, every user WITHOUT archlinux-appstream-data installed keeps
# working (they use the pacman-verified local catalogue) but silently loses
# category matching and icons once the pinned catalogue goes stale, because the
# build refuses artifacts that do not match the committed hashes. Nothing warns
# them; the panel just quietly returns fewer results.
#
# This workflow turns that into a reviewable pull request: it regenerates the
# pins with tools/update_pins.sh, verifies them against the real artifacts, and
# opens the PR. A human still merges it — the pin is the trust anchor, so the
# diff is a security review, not a chore.

on:
  schedule:
    # Arch ships catalogue updates roughly weekly; twice daily is ample and keeps
    # overlapping runs unlikely.
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check for a newer catalogue release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the committed pin against upstream
        id: probe
        run: |
          set -euo pipefail
          committed=$(sed -n "s/^PINNED_PKGVER='\([0-9]\{8\}\)'.*/\1/p" appstream_pins.sh)
          # The packaging repo's default branch is 'main', not 'master'.
          upstream=$(curl -fsSL --retry 3 --max-time 60 "$PKGBUILD_URL" \
            | sed -n 's/^pkgver=\([0-9]\{8\}\).*/\1/p' | head -1)
          echo "committed=${committed}"
          echo "upstream=${upstream}"
          if [ -z "$committed" ] || [ -z "$upstream" ]; then
            echo "could not read a pkgver from either side; skipping"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          elif [ "$upstream" != "$committed" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

        env:
          PKGBUILD_URL: https://gitlab.archlinux.org/archlinux/packaging/packages/archlinux-appstream-data/-/raw/main/PKGBUILD

      - name: Regenerate and verify the pins
        if: steps.probe.outputs.stale == 'true'
        run: |
          set -euo pipefail
          tools/update_pins.sh bump "${{ steps.probe.outputs.upstream }}"
          # Prove the regenerated hashes match the artifacts actually published,
          # so the PR cannot contain a checksum that was never checked.
          tools/update_pins.sh verify

      - name: Open the bump pull request
        if: steps.probe.outputs.stale == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bump/appstream-pin-${{ steps.probe.outputs.upstream }}
          title: 'Bump AppStream catalogue pin to ${{ steps.probe.outputs.upstream }}'
          commit-message: 'Bump AppStream catalogue pin to ${{ steps.probe.outputs.upstream }}'
          add-paths: appstream_pins.sh
          body: |
            Arch published a new `archlinux-appstream-data` release.

            | | |
            |---|---|
            | committed pin | `${{ steps.probe.outputs.committed }}` |
            | upstream pkgver | `${{ steps.probe.outputs.upstream }}` |

            Generated by `.github/workflows/pin-check.yml`. The pins were
            regenerated with `tools/update_pins.sh bump` and then re-verified with
            `tools/update_pins.sh verify`, which re-downloads all 12 artifacts from
            sources.archlinux.org and checks them against the committed hashes.

            ### Why this needs a human
            `appstream_pins.sh` is the **trust anchor** for FossFetch's network
            download path: every downloaded archive is checked against these
            hashes before it is parsed, and a mismatch is refused. Merging this is
            a security decision, so please read the diff — particularly the header
            comment, which documents upstream quirks (some core icon sizes are
            genuinely published with identical hashes).

            Until it lands, users without `archlinux-appstream-data` installed are
            silently losing category matching and icons.